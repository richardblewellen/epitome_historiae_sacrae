<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Quiz Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="worksheet.css">
</head>
<body>

    <div id="no-print-controls" class="controls-wrapper">
        <h1>Worksheet Generator</h1>
        
        <div class="dropdown-wrapper">
            <button id="btn-dropdown-toggle">Pick stories for quiz ▼</button>
            <button id="btn-clear-selection">Clear All</button>
            
            <!-- this is the print buttnon with css -->
            <a href="index.html" id="btn-to-reader" class="primary-btn" style="text-decoration: none; padding: 10px 15px; border-radius: 4px; background: #6c757d; color: white;">📖 Back to Reader</a>
            
            <button id="btn-print" class="primary-btn">🖨️ Print Worksheet</button>
            
            <div id="story-list-container" class="dropdown-content"></div>
        </div>
    </div>

    <div id="worksheet-container">
        </div>

    <script src="data.js"></script>
    <script src="worksheet.js"></script>

</body>
</html>
