<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Worksheet Generator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="worksheet.css">
</head>
<body>

    <div id="no-print-controls" class="controls-wrapper">
        <h1>Worksheet Generator</h1>
        
        <div id="loading-message" style="text-align: center; padding: 10px; font-weight: bold; color: #0d6efd;">
            Loading stories from the database...
        </div>

        <div id="controls-selection-group" style="display: none; flex-direction: column; align-items: center; gap: 15px;">
            
            <div class="type-selector" style="font-size: 1.1em;">
                <label style="margin-right: 20px; cursor: pointer;">
                    <input type="radio" name="worksheet-type" value="study-sheet" checked> Two-Column Study Sheet
                </label>
                <label style="cursor: pointer;">
                    <input type="radio" name="worksheet-type" value="quiz"> Quiz & Answer Key
                </label>
            </div>

            <div class="dropdown-wrapper">
                
                <select id="select-master-set"></select>

                <div style="position: relative;">
                    <button id="btn-dropdown-toggle">Pick stories.</button>
                    <button id="btn-clear-selection">Clear All</button>
                    <div id="story-list-container" class="dropdown-content"></div>
                </div>
                
                <a href="index.html" id="btn-to-reader">📖 Back to Reader</a>
                
                <button id="btn-print">🖨️ Print Worksheet</button>
            </div>
        </div>
    </div>

    <div id="worksheet-container">
        <!-- JavaScript will inject the worksheet content here -->
    </div>

    <script src="worksheet.js"></script>

</body>
</html>
