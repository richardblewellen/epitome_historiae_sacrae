<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio - Ancient Greek Reader</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="studio.css">
</head>
<body>

<div id="studio-layout">
    <!-- SIDEBAR CONTROLS (Hidden when printing) -->
    <aside id="sidebar" class="no-print">
        <h1 style="margin-top: 0; font-size: 1.5em; border-bottom: 2px solid #ccc; padding-bottom: 10px;">Teacher Studio</h1>
        
        <div id="loading-message" style="color: #0d6efd; font-weight: bold; margin-bottom: 15px;">
            Loading database...
        </div>

        <div id="controls-selection-group" style="display: none; flex-direction: column; gap: 20px;">
            
            <!-- 1. WORKSHEET TYPE -->
            <div class="control-group">
                <h3>1. Document Type</h3>
                <label style="cursor: pointer; display: block; margin-bottom: 8px;">
                    <input type="radio" name="worksheet-type" value="study-sheet" checked> Two-Column Study Sheet
                </label>
                <label style="cursor: pointer; display: block;">
                    <input type="radio" name="worksheet-type" value="quiz"> Quiz & Answer Key (Half-Page)
                </label>
            </div>

            <!-- 2. CONTENT SELECTION -->
            <div class="control-group">
                <h3>2. Select Content</h3>
                <select id="select-master-set" style="width: 100%; margin-bottom: 10px;"></select>
                
                <div class="dropdown-wrapper" style="width: 100%;">
                    <button id="btn-dropdown-toggle" style="width: 100%;">Pick stories...</button>
                    <div id="story-list-container" class="dropdown-content" style="width: 100%; box-sizing: border-box;"></div>
                </div>
                <button id="btn-clear-selection" style="width: 100%; margin-top: 5px;">Clear Selection</button>
            </div>

            <!-- 3. FORMATTING SLIDERS -->
            <div class="control-group">
                <h3>3. Custom Formatting</h3>
                
                <div class="sliders">
                    <label>Greek Size: <span id="val-font">1.4</span>em
                        <input type="range" id="print-font-size" min="1" max="2.5" step="0.1" value="1.4">
                    </label>
                    <label>Row Spacing: <span id="val-spacing">15</span>px
                        <input type="range" id="print-spacing" min="5" max="40" step="1" value="15">
                    </label>
                    <label>Quiz Blank Line: <span id="val-blank">25</span>px
                        <input type="range" id="print-blank-line" min="15" max="60" step="1" value="25">
                    </label>
                </div>
            </div>

            <!-- 4. ACTIONS -->
            <div class="control-group" style="border-bottom: none;">
                <button id="btn-print" class="primary-btn">🖨️ Print Worksheet</button>
                <a href="index.html" class="secondary-btn" style="text-align: center; margin-top: 10px;">📖 Back to Reader</a>
            </div>

           <!-- 5. AUDIO EXPORT (WASM) -->
<div class="control-group" style="background: #f1f1f1; padding: 15px; border-radius: 5px; border-bottom: none;">
    <h3 style="margin-top: 0;">4. Audio Export</h3>
    
    <div class="sliders" style="margin-bottom: 15px;">
        <label>Speed: <span id="export-speed-val">0.7</span>x
            <input type="range" id="export-slider-speed" min="0.5" max="1" step="0.1" value="0.7">
        </label>
        <label>Pause: <span id="export-pause-val">0.5</span>s
            <input type="range" id="export-slider-pause" min="0" max="2" step="0.5" value="0.5">
        </label>
        <label>Repeat: <span id="export-repeat-val">1</span>x
            <input type="range" id="export-slider-repeat" min="1" max="4" step="1" value="1">
        </label>
    </div>

    <button id="btn-export-audio" class="primary-btn" style="background: #198754; border-color: #198754;">🎵 Generate Audio File</button>
    <div id="audio-status" style="margin-top: 10px; font-size: 0.85em; color: #666; text-align: center;"></div>
</div>
            
        </div>
    </aside>

    <!-- PREVIEW AREA -->
    <main id="preview-area">
        <div id="worksheet-container">
            <!-- JavaScript will inject the worksheet content here -->
            <div style="text-align: center; color: #999; margin-top: 50px;">
                <em>Select a set and stories from the sidebar to generate a preview.</em>
            </div>
        </div>
    </main>
</div>

<script src="studio.js"></script>
</body>
</html>
